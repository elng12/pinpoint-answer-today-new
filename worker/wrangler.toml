name = "pinpoint-worker"
main = "src/index.ts"
compatibility_date = "2025-11-10"
compatibility_flags = ["nodejs_compat"]

# KV — stores daily puzzle docs (key: "pinpoint:YYYY-MM-DD")
[[kv_namespaces]]
binding = "PP_DATA"
id = "2689a48e886548a3acbe8fa9ede4e3f6"
preview_id = "pp_data_dev"

# Workers AI (optional — used for content enrichment)
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Cron schedule (UTC)
# Beijing 16:01 / 16:03 / 16:07 / 16:10 / 16:15 / 16:20  →  UTC 08:xx
# ---------------------------------------------------------------------------
[triggers]
crons = ["1,3,7,10,15,20 8 * * *"]

# ---------------------------------------------------------------------------
# Shared vars (non-secret).  Secrets are set via `wrangler secret put`.
# ---------------------------------------------------------------------------
[vars]
GRAPHQL_ENDPOINT            = ""
VOYAGER_GRAPHQL_ENDPOINT    = "https://www.linkedin.com/voyager/api/graphql"
FALLBACK_WEBHOOK            = ""
ALLOW_SELF_GRAPHQL          = "false"

# New-site direct publish (GitHub)
GITHUB_REPO_NEW_SITE        = "elng12/pinpoint-answer-today-new"
GITHUB_BRANCH_NEW_SITE      = "main"
NEW_SITE_URL                = "https://pinpointanswertoday.app"

# Feature flags
AUTO_PUBLISH_ENABLED        = "true"
AUTO_ENRICH_ENABLED         = "true"
AUTO_I18N_ENABLED           = "false"
AUTO_I18N_LOCALES           = "fr,de,pt-BR"
AUTO_I18N_PARALLEL          = "2"

# Timeouts (ms)
AUTO_PUBLISH_TIMEOUT_MS     = "15000"
AUTO_ENRICH_TIMEOUT_MS      = "55000"
AUTO_I18N_TIMEOUT_MS        = "90000"

# Models
AUTO_ENRICH_MODEL           = "openai/gpt-4o-mini"
AUTO_I18N_MODEL             = "openai/gpt-4o-mini"

# Legacy publish base — leave empty; old publish API no longer exists
SITE_BASE_URL               = ""

# ---------------------------------------------------------------------------
# Secrets — set via Cloudflare Dashboard or `wrangler secret put <NAME>`
# See worker/README.md for full list
# ---------------------------------------------------------------------------
# GRAPHQL_COOKIE               — LinkedIn raw cookie string, e.g. "li_at=...; JSESSIONID=..."
# GRAPHQL_TOKEN                — Optional bearer token for GraphQL endpoint
# GRAPHQL_CSRF_TOKEN           — Optional CSRF token for Voyager GraphQL
# SITE_API_TOKEN               — Bearer token for /api/admin/generate-draft (enrichment)
# GITHUB_TOKEN_NEW_SITE        — Fine-grained PAT: contents:write on new repo
# NEW_SITE_REVALIDATE_SECRET   — Must match REVALIDATE_SECRET in Vercel env
# FEISHU_WEBHOOK_URL           — Feishu webhook URL for cron alerts
# FALLBACK_WEBHOOK_SECRET      — HMAC signing secret for fallback webhook (unused; FALLBACK_WEBHOOK cleared)
# ADMIN_SECRET                 — Admin secret for protected endpoints
# WORKER_ADMIN_SECRET          — Worker admin secret (separate from ADMIN_SECRET)

# ---------------------------------------------------------------------------
# Development overrides
# ---------------------------------------------------------------------------
[env.development.vars]
GRAPHQL_ENDPOINT            = "http://localhost:3000/api/graphql"
AUTO_PUBLISH_ENABLED        = "false"
AUTO_ENRICH_ENABLED         = "false"
AUTO_I18N_ENABLED           = "false"

[[env.development.kv_namespaces]]
binding = "PP_DATA"
preview_id = "pp_data_dev"

# ---------------------------------------------------------------------------
# Shadow (stage A) — 影子运行，只抓取 + 写 KV，不写 GitHub，不触发 revalidate，不发告警
# 部署命令：wrangler deploy --env shadow --name pinpoint-worker-shadow
# 不绑定 Cron，只能手动触发
# 需要配置的 Secrets（仅抓取相关）：GRAPHQL_COOKIE、GRAPHQL_TOKEN、GRAPHQL_CSRF_TOKEN
# 不要配置：GITHUB_TOKEN_NEW_SITE、NEW_SITE_REVALIDATE_SECRET、SITE_API_TOKEN
# ---------------------------------------------------------------------------
[env.shadow.vars]
GRAPHQL_ENDPOINT            = ""
VOYAGER_GRAPHQL_ENDPOINT    = "https://www.linkedin.com/voyager/api/graphql"
FALLBACK_WEBHOOK            = ""
ALLOW_SELF_GRAPHQL          = "false"
GITHUB_REPO_NEW_SITE        = "elng12/pinpoint-answer-today-new"
GITHUB_BRANCH_NEW_SITE      = "main"
NEW_SITE_URL                = "https://pinpointanswertoday.app"
AUTO_PUBLISH_ENABLED        = "false"
AUTO_ENRICH_ENABLED         = "false"
AUTO_I18N_ENABLED           = "false"
AUTO_I18N_LOCALES           = "fr,de,pt-BR"
AUTO_I18N_PARALLEL          = "2"
AUTO_PUBLISH_TIMEOUT_MS     = "15000"
AUTO_ENRICH_TIMEOUT_MS      = "55000"
AUTO_I18N_TIMEOUT_MS        = "90000"
AUTO_ENRICH_MODEL           = "openai/gpt-4o-mini"
AUTO_I18N_MODEL             = "openai/gpt-4o-mini"
SITE_BASE_URL               = ""

[[env.shadow.kv_namespaces]]
binding = "PP_DATA"
id = "2689a48e886548a3acbe8fa9ede4e3f6"

[env.shadow.triggers]
crons = []

[env.shadow.ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Staging (stage B) — 受控演练，允许完整链路，但只能手动触发，不绑定 Cron
# 部署命令：wrangler deploy --env staging --name pinpoint-worker-staging
# 需要配置全套 Secrets（GITHUB_TOKEN_NEW_SITE、NEW_SITE_REVALIDATE_SECRET 等）
# ---------------------------------------------------------------------------
[env.staging.vars]
GRAPHQL_ENDPOINT            = ""
VOYAGER_GRAPHQL_ENDPOINT    = "https://www.linkedin.com/voyager/api/graphql"
FALLBACK_WEBHOOK            = ""
ALLOW_SELF_GRAPHQL          = "false"
GITHUB_REPO_NEW_SITE        = "elng12/pinpoint-answer-today-new"
GITHUB_BRANCH_NEW_SITE      = "main"
NEW_SITE_URL                = "https://pinpointanswertoday.app"
AUTO_PUBLISH_ENABLED        = "true"
AUTO_ENRICH_ENABLED         = "true"
AUTO_I18N_ENABLED           = "false"
AUTO_I18N_LOCALES           = "fr,de,pt-BR"
AUTO_I18N_PARALLEL          = "2"
AUTO_PUBLISH_TIMEOUT_MS     = "15000"
AUTO_ENRICH_TIMEOUT_MS      = "55000"
AUTO_I18N_TIMEOUT_MS        = "90000"
AUTO_ENRICH_MODEL           = "openai/gpt-4o-mini"
AUTO_I18N_MODEL             = "openai/gpt-4o-mini"
SITE_BASE_URL               = ""

[[env.staging.kv_namespaces]]
binding = "PP_DATA"
id = "2689a48e886548a3acbe8fa9ede4e3f6"

[env.staging.triggers]
crons = []

[env.staging.ai]
binding = "AI"
