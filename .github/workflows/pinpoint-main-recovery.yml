name: Pinpoint Main Recovery

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: pinpoint-main-recovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-content:
    name: Recover Pinpoint Content Gate
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout failed main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create repair candidate branch for known content failures
        run: node scripts/recover-pinpoint-main-content.mjs --require-origin-main
