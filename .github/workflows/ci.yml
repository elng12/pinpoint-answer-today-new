name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "pinpoint/candidate/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: CI Preflight
    runs-on: ubuntu-latest
    outputs:
      skip_checks: ${{ steps.intermediate.outputs.skip_checks }}
      reason: ${{ steps.intermediate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Pinpoint intermediate state commit
        id: intermediate
        run: |
          if [[ "${{ github.event_name }}" != "push" || "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "skip_checks=false" >> "$GITHUB_OUTPUT"
            echo "reason=not a main push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if node scripts/pinpoint-intermediate-state.mjs skip-if-intermediate; then
            echo "skip_checks=true" >> "$GITHUB_OUTPUT"
            echo "reason=Pinpoint intermediate state-only commit" >> "$GITHUB_OUTPUT"
          else
            echo "skip_checks=false" >> "$GITHUB_OUTPUT"
            echo "reason=site-affecting or public commit" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, Typecheck, Guardrails
    needs: preflight
    if: needs.preflight.outputs.skip_checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pinpoint Guardrails
        run: npm run test:pinpoint-guardrails

      - name: Build
        run: npm run build

      - name: Pinpoint Rendered Content Gate
        run: npm run test:pinpoint-rendered

  promote-pinpoint-candidate:
    name: Promote Pinpoint Candidate
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pinpoint/candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fast-forward main after machine checks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --ff-only "$GITHUB_SHA"
          git push origin HEAD:main
