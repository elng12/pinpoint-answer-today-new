name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "pinpoint/candidate/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: CI Preflight
    runs-on: ubuntu-latest
    outputs:
      skip_checks: ${{ steps.intermediate.outputs.skip_checks }}
      reason: ${{ steps.intermediate.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Pinpoint intermediate state commit
        id: intermediate
        run: |
          if [[ "${{ github.event_name }}" != "push" || "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "skip_checks=false" >> "$GITHUB_OUTPUT"
            echo "reason=not a main push" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if node scripts/pinpoint-intermediate-state.mjs skip-if-intermediate; then
            echo "skip_checks=true" >> "$GITHUB_OUTPUT"
            echo "reason=Pinpoint intermediate state-only commit" >> "$GITHUB_OUTPUT"
          else
            echo "skip_checks=false" >> "$GITHUB_OUTPUT"
            echo "reason=site-affecting or public commit" >> "$GITHUB_OUTPUT"
          fi

  checks:
    name: Lint, Typecheck, Guardrails
    needs: preflight
    if: needs.preflight.outputs.skip_checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Data
        run: npm run validate:data

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Pinpoint Guardrails
        run: npm run test:pinpoint-guardrails

      - name: Build
        run: npm run build

      - name: Pinpoint Rendered Content Gate
        run: npm run test:pinpoint-rendered

  promote-pinpoint-candidate:
    name: Promote Pinpoint Candidate
    needs: checks
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pinpoint/candidate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      deployments: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate candidate branch scope
        run: |
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:scripts/check-pinpoint-candidate-branch.mjs > /tmp/check-pinpoint-candidate-branch.mjs
          node /tmp/check-pinpoint-candidate-branch.mjs \
            --base origin/main \
            --head "$GITHUB_SHA" \
            --branch "$GITHUB_REF_NAME"

      - name: Create unique main commit after machine checks
        id: promote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B main origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "candidate is already contained in main"
          else
            git merge --no-ff --no-edit "$GITHUB_SHA"
          fi
          git push origin HEAD:main
          echo "production_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify promoted candidate on production
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/verify-pinpoint-candidate-release.mjs \
            --candidate-branch "$GITHUB_REF_NAME" \
            --candidate-sha "$GITHUB_SHA" \
            --production-sha "${{ steps.promote.outputs.production_sha }}" \
            --repair-missing-production

      - name: Delete promoted candidate branch
        run: |
          if git ls-remote --exit-code --heads origin "$GITHUB_REF_NAME"; then
            git push origin --delete "$GITHUB_REF_NAME"
          fi
          if git ls-remote --exit-code --heads origin "$GITHUB_REF_NAME"; then
            echo "candidate branch still exists after delete: $GITHUB_REF_NAME"
            exit 1
          fi
